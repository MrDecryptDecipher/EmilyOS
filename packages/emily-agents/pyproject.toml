[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emily-agents"
version = "0.1.0"
description = "Emily OS agent runtime — spawn, supervise, verify, destroy"
requires-python = ">=3.12"
dependencies = [
  "emily-core",
  "emily-config",
  "emily-events",
  "emily-observability",
  "emily-kernel",
  "emily-missions",
  "pydantic>=2.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["emily*"]
namespaces = true
