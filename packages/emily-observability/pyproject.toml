[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emily-observability"
version = "0.1.0"
description = "Emily OS observability adapters and ports implementations"
requires-python = ">=3.12"
dependencies = [
  "emily-core",
  "orjson>=3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["emily*"]
namespaces = true
