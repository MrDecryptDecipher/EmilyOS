[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emily-browser"
version = "0.1.0"
description = "Emily OS browser runtime — Playwright, profiles, DOM grounding, CDP"
requires-python = ">=3.12"
dependencies = [
  "emily-core",
  "emily-config",
  "emily-events",
  "emily-observability",
  "emily-kernel",
  "emily-tools",
  "playwright>=1.49.0",
  "pydantic>=2.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["emily*"]
namespaces = true
