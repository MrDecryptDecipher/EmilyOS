[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emily-providers"
version = "0.1.0"
description = "Emily OS provider fabric — LLM adapters, router, analytics"
requires-python = ">=3.12"
dependencies = [
  "emily-core",
  "emily-config",
  "emily-events",
  "emily-observability",
  "emily-kernel",
  "httpx>=0.28.1",
  "pydantic>=2.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["emily*"]
namespaces = true
