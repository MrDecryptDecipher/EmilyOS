[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emily-tools"
version = "0.1.0"
description = "Emily OS tool & MCP runtime — permissions, discovery, hot reload"
requires-python = ">=3.12"
dependencies = [
  "emily-core",
  "emily-config",
  "emily-events",
  "emily-observability",
  "emily-kernel",
  "pydantic>=2.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["emily*"]
namespaces = true
