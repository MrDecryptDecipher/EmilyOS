[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emily-events"
version = "0.1.0"
description = "Emily OS async event bus"
requires-python = ">=3.12"
dependencies = [
  "emily-core",
  "pydantic>=2.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["emily*"]
namespaces = true
